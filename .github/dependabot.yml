version: 2
updates:
  - package-ecosystem: npm # covers pnpm lockfiles
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies] # override the default (dependencies + javascript)
    groups:
      non-major:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: / # scans .github/workflows
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
